version: 2.1

jobs:
  cypress-tests:
    docker:
      - image: cypress/included:15.7.0

    steps:
      - checkout

      - run:
          name: Debug Cypress
          command: |
            cd cypress-homework
            node -v
            npm -v
            npx cypress version

      - run:
          name: Install Cypress dependencies
          command: |
            cd cypress-homework
            npm install

      - run:
          name: Run Cypress tests
          command: |
            cd cypress-homework
            cypress run

workflows:
  build-and-test:
    jobs:
      - cypress-tests